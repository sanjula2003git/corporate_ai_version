# nginx config for the single-page app on Cloud Run.
# Cloud Run routes traffic to port 8080 by default, so listen there.
# try_files ... /index.html makes client-side routing work on refresh
# (the same job vercel.json's "rewrites" did on Vercel).
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
