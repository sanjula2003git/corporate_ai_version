# Deploys the React/Vite frontend (frontend/) to Azure Static Web Apps.
#
# One-time setup:
#   1. In the Azure Portal: create a "Static Web App" (Free tier is fine),
#      choosing "Other" / skipping the build details (this workflow handles it).
#   2. Copy its deployment token (Portal -> the Static Web App -> "Manage
#      deployment token") and add it as a GitHub repo secret named
#      AZURE_STATIC_WEB_APPS_API_TOKEN.
#   3. Add a repo VARIABLE (not secret) VITE_API_URL = your backend URL, e.g.
#      https://corporatetraining.azurewebsites.net  (NO trailing slash).
#      Vite bakes this into the JS at BUILD time.
name: Deploy frontend to Azure Static Web Apps

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/azure-static-web-apps-frontend.yml"
  workflow_dispatch: {}

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - uses: actions/checkout@v4

      - name: Build And Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "upload"
          app_location: "frontend"     # source of the Vite app
          output_location: "dist"      # where `npm run build` emits files
        env:
          # Baked into the bundle at build time (import.meta.env.VITE_API_URL).
          VITE_API_URL: ${{ vars.VITE_API_URL }}
