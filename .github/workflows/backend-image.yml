# Builds the backend Docker image in the cloud (GitHub's servers) and pushes
# it to Docker Hub, so AWS Lightsail can pull and run it. No Docker needed
# on your own computer.
#
# Requires two GitHub repository secrets (Settings -> Secrets and variables ->
# Actions -> New repository secret):
#   DOCKERHUB_USERNAME  = your Docker Hub username
#   DOCKERHUB_TOKEN     = a Docker Hub access token (Docker Hub -> Account
#                         settings -> Personal access tokens -> Generate)
#
# After it runs, your image is at:
#   docker.io/<DOCKERHUB_USERNAME>/corporate-ai-backend:latest
name: Build and push backend image

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-image.yml"
  workflow_dispatch: {}   # lets you run it manually from the Actions tab

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build the backend image and push it
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/corporate-ai-backend:latest
